documents:
  project_spec: docs/project-spec.md
  initial_brief: docs/initial-brief.md
  readme: README.md
  coding_rules: docs/rules-coding.md
  ux_rules: docs/rules-ux.md
  writing_rules: docs/rules-writing.md
  design: DESIGN.md
  architecture: ARCHITECTURE.md
  contributing: CONTRIBUTING.md
  changelog: CHANGELOG.md
  tracks: docs/tracks/
  integrations: docs/integrations/

precedence:
  - docs/project-spec.md
  - docs/rules-coding.md
  - docs/rules-ux.md
  - DESIGN.md
  - docs/rules-writing.md
  - ARCHITECTURE.md
  - CONTRIBUTING.md
  - README.md
  - CHANGELOG.md
  - docs/tracks/
  - docs/integrations/

read_path:
  required:
    - docs/project-spec.md
  default:
    - README.md
  situational:
    specification_or_acceptance:
      - docs/project-spec.md
    implementation:
      - docs/rules-coding.md
      - ARCHITECTURE.md
    ui_or_screen_work:
      - docs/rules-ux.md
      - DESIGN.md
    writing_or_publication:
      - docs/rules-writing.md
      - README.md
      - CHANGELOG.md
    decision_or_long_running_work:
      - docs/tracks/
      - docs/integrations/
      - CONTRIBUTING.md
  avoid_up_front:
    - ARCHITECTURE.md
    - DESIGN.md
    - docs/tracks/
    - docs/integrations/
    - CONTRIBUTING.md
    - CHANGELOG.md
